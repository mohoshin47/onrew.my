<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneRewards</title>
    <script>
        // SPA Routing Fallback for static hosting
        var l = window.location;
        if (l.pathname !== '/') {
            window.location.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/#' + l.pathname);
        } else {
            window.location.replace('/');
        }
    </script>
</head>
<body>
<p>Loading OneRewards...</p>
</body>
</html>
